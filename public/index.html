
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELTRIQ GLOBAL.</title>
<style>
body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
header{padding:22px;background:#111a30;border-bottom:1px solid #263452}
h1{color:#8b9cff;margin:0}
main{max-width:800px;margin:50px auto;padding:20px}
.box{background:#151d33;border:1px solid #303d60;border-radius:16px;padding:25px}
textarea{width:100%;height:100px;background:#0b1020;color:white;border:1px solid #35446b;border-radius:10px;padding:12px;box-sizing:border-box}
button{margin-top:12px;padding:13px 25px;background:#6558e8;color:white;border:0;border-radius:9px;cursor:pointer}
#respuesta{margin-top:20px;white-space:pre-wrap}
</style>
</head>
<body>
<header><h1>NEXORA AI</h1><p>Tu asistente inteligente</p></header>
<main><div class="box">
<h2>¿En qué puedo ayudarte?</h2>
<textarea id="mensaje" placeholder="Escribe aquí tu mensaje..."></textarea>
<button onclick="enviar()">Enviar mensaje</button>
<div id="respuesta"></div>
</div></main>
<script>
async function enviar(){
const m=document.getElementById("mensaje").value;
const r=document.getElementById("respuesta");
r.textContent="Nexora está preparando tu respuesta...";
try{
const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m})});
const d=await res.json();r.textContent=d.reply;
}catch(e){r.textContent="No se pudo conectar con el servidor.";}
}
</script>
</body>
</html>
