<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexora AI</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#14284a,#080d18 60%);color:#edf4ff;font:16px system-ui;min-height:100vh}.layout{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{padding:25px;border-right:1px solid #24334e;background:#080d18aa}.brand{font-size:25px;font-weight:800}.brand span{color:#69a2ff}.muted{color:#9aacc8;font-size:13px}.new{margin-top:30px;padding:12px;width:100%;background:#122342;border:1px solid #34517b;color:white;border-radius:12px;cursor:pointer}main{max-width:850px;width:100%;margin:auto;padding:28px 22px;display:flex;flex-direction:column}.top{color:#9aacc8;font-size:13px;display:flex;justify-content:space-between}.hero{text-align:center;margin:12vh auto 28px}.orb{width:66px;height:66px;margin:0 auto 20px;border-radius:22px;background:linear-gradient(135deg,#3e7bff,#8b5cf6);display:grid;place-items:center;font-size:30px}h1{font-size:clamp(32px,5vw,50px);margin:0 0 12px;letter-spacing:-1px}.hero p{color:#9aacc8}.chat{max-width:740px;width:100%;margin:auto}.messages{display:flex;flex-direction:column;gap:12px;margin-bottom:15px}.msg{padding:14px 16px;border-radius:16px;max-width:85%;white-space:pre-wrap;line-height:1.5}.user{align-self:flex-end;background:#1d3c70}.bot{align-self:flex-start;background:#101a2c;border:1px solid #24334e}form{display:flex;gap:10px;background:#101a2c;border:1px solid #24334e;border-radius:16px;padding:10px}input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;padding:8px;font-size:16px}button.send{background:#4c8dff;border:0;border-radius:11px;color:white;padding:0 18px;cursor:pointer}.foot{text-align:center;color:#7185a5;font-size:12px;margin:12px}@media(max-width:650px){.layout{grid-template-columns:1fr}.side{display:none}main{padding:18px 12px}.hero{margin-top:9vh}}</style></head><body><div class="layout"><aside class="side"><div class="brand">NEXORA <span>AI</span></div><p class="muted">Tu asistente inteligente</p><button class="new" onclick="clearChat()">＋ Nueva conversación</button><p class="muted" style="margin-top:25px">PROTOTIPO INICIAL<br>Interfaz y servidor listos.<br>IA real pendiente de conectar.</p></aside><main><div class="top"><span>Workspace · Personal</span><span>Prototipo</span></div><section class="hero" id="hero"><div class="orb">✦</div><h1>¿En qué puedo ayudarte?</h1><p>Escribe abajo para comenzar una conversación con Nexora.</p></section><section class="chat"><div class="messages" id="messages"></div><form id="form"><input id="input" placeholder="Escribe tu mensaje a Nexora..." required autocomplete="off"><button class="send">Enviar ↗</button></form><div class="foot">Nexora · La IA real se conectará en el siguiente paso.</div></section></main></div><script>
const f=document.querySelector('#form'),i=document.querySelector('#input'),m=document.querySelector('#messages'),h=document.querySelector('#hero');function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;m.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'nearest'})}function clearChat(){m.innerHTML='';h.style.display='block';i.focus()}f.addEventListener('submit',async e=>{e.preventDefault();let message=i.value.trim();if(!message)return;h.style.display='none';add(message,'user');i.value='';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});let d=await r.json();add(d.reply||d.error,'bot')}catch{add('No se pudo contactar con el servidor.','bot')}})
</script></body></html>
